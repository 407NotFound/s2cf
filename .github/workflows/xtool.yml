name: xtool
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblzma-dev libssl-dev libcurl4-openssl-dev zlib1g-dev pkg-config libxml2-dev libsqlite3-dev libimobiledevice-dev libusbmuxd-dev libplist-dev libimobiledevice-glue-dev libusb-1.0-0-dev
      - name: clone
        run: git clone --depth 1 https://github.com/joshuaswarren/omarchy-apple-dev.git
      - name: install toolchain
        run: |
          cd omarchy-apple-dev
          chmod +x install-toolchain.sh
          timeout 1500 ./install-toolchain.sh --mode no-xcode --user-only 2>&1 | tail -60
          echo "EXIT=${PIPESTATUS[0]}"
      - name: versions
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          swift --version || true
          xtool --version || true
          ls ~/.local/bin 2>/dev/null | head
