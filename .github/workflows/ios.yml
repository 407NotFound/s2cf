name: ios
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch godot + templates
        run: |
          set -e
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_macos.universal.zip
          unzip -q godot.zip
          sudo mv Godot.app /Applications/Godot.app
          GODOT=/Applications/Godot.app/Contents/MacOS/Godot
          $GODOT --version
          curl -sL -o tpl.tpz https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          unzip -q tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/Library/Application Support/Godot/export_templates/4.5.stable"
          ls "$HOME/Library/Application Support/Godot/export_templates/4.5.stable" | head

      - name: probe ios export options
        run: |
          strings -a /Applications/Godot.app/Contents/MacOS/Godot | grep -E "^application/" | sort -u | head -40
          echo "---- project name ----"
          strings -a /Applications/Godot.app/Contents/MacOS/Godot | grep -E "application/config/name" | sort -u | head -5

      - name: export xcode project
        run: |
          set -e
          GODOT=/Applications/Godot.app/Contents/MacOS/Godot
          $GODOT --headless --path . --import || true
          mkdir -p build/ios
          $GODOT --headless --path . --export-release "iOS" build/ios/
          ls -la build/ios | head -20


      - name: normalize empty app name
        run: |
          set -e
          cd build/ios
          if [ -f "./-Info.plist" ]; then
            echo "detected empty app name, normalizing..."
            mv ./-Info.plist ./S2CF-Info.plist
            [ -f "./.pck" ] && mv ./.pck ./S2CF.pck || true
            [ -d "./.xcodeproj" ] && mv ./.xcodeproj ./S2CF.xcodeproj
            [ -d "./.xcframework" ] && mv ./.xcframework ./S2CF.xcframework || true
            P=./S2CF.xcodeproj/project.pbxproj
            sed -i '' 's/-Info\.plist/S2CF-Info.plist/g' "$P"
            sed -i '' 's/\.xcframework/S2CF.xcframework/g' "$P"
            sed -i '' 's/"\.pck"/"S2CF.pck"/g' "$P"
            sed -i '' 's/PRODUCT_NAME = "";/PRODUCT_NAME = S2CF;/g' "$P"
            sed -i '' 's/PRODUCT_NAME = \.pck;/PRODUCT_NAME = S2CF;/g' "$P"
            grep -n "PRODUCT_NAME" "$P" | head -5
          fi
          ls -la | head -12

      - name: xcodebuild (unsigned)
        run: |
          set -e
          cd build/ios
          PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          echo "project=$PROJ"
          SCHEME=$(basename "$PROJ" .xcodeproj)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(grep -m1 'productName = ' "$PROJ/project.pbxproj" | sed 's/.*productName = \([^;]*\);/\1/' | tr -d '"')
          fi
          echo "scheme=$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release \
            -derivedDataPath ../dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          find ../dd/Build/Products -maxdepth 2 -name "*.app"

      - name: package ipa
        run: |
          set -e
          APP=$(find build/dd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "app=$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry S2CF-unsigned.ipa Payload && ls -lh S2CF-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: S2CF-unsigned-ipa
          path: out/S2CF-unsigned.ipa
