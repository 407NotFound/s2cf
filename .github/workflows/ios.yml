name: ios
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch godot + templates
        run: |
          set -e
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_macos.universal.zip
          unzip -q godot.zip
          sudo mv Godot.app /Applications/Godot.app
          GODOT=/Applications/Godot.app/Contents/MacOS/Godot
          $GODOT --version
          curl -sL -o tpl.tpz https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          unzip -q tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/Library/Application Support/Godot/export_templates/4.5.stable"
          ls "$HOME/Library/Application Support/Godot/export_templates/4.5.stable" | head

      - name: export xcode project
        run: |
          set -e
          GODOT=/Applications/Godot.app/Contents/MacOS/Godot
          $GODOT --headless --path . --import || true
          mkdir -p build/ios
          $GODOT --headless --path . --export-release "iOS" build/ios/
          ls -la build/ios | head -20

      - name: xcodebuild (unsigned)
        run: |
          set -e
          cd build/ios
          PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          echo "project=$PROJ"
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "scheme=$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release \
            -derivedDataPath ../dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          find ../dd/Build/Products -maxdepth 2 -name "*.app"

      - name: package ipa
        run: |
          set -e
          APP=$(find build/dd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "app=$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry S2CF-unsigned.ipa Payload && ls -lh S2CF-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: S2CF-unsigned-ipa
          path: out/S2CF-unsigned.ipa
